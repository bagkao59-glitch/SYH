};
const BG = { phone: 'linear-gradient(145deg,#4be08a,#12a85a)', kakao: '#fee500', gallery: 'linear-gradient(145deg,#ff8aa0,#f2486a)', cal: 'linear-gradient(145deg,#5aa2ff,#2d6be4)' };
const icon = id => `<i class="ic" style="background:${BG[id]}">${D.icons[id] ? `<img src="${D.icons[id]}" alt="">` : G[id]}</i>`;
const L = p => `<svg class="l" viewBox="0 0 24 24">${p}</svg>`;
const SEARCH = L('<circle cx="10.5" cy="10.5" r="6"/><path d="M15 15l5 5"/>');
const NEWCHAT = L('<path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6l-5 4v-4a3 3 0 0 1-2-3z"/><path d="M12 7v6M9 10h6"/>');
const GEAR = L('<circle cx="12" cy="12" r="7.5" stroke-dasharray="3.2 2.6"/><circle cx="12" cy="12" r="2.8"/>');
const MENU = L('<path d="M4 7h16M4 12h16M4 17h16"/>');
const APPS = [['phone', '전화'], ['kakao', '카카오톡'], ['gallery', '갤러리'], ['cal', '캘린더']];
const CALL = { in: ['↙', '수신'], out: ['↗', '발신'], miss: ['↙', '부재중'] };
const bgOf = p => p.src ? `center/cover url(${p.src})` : p.bg;
const ab = (t, big, ri = '') => big ? `<header class="ab big"><b>${E(t)}</b></header>` : `<header class="ab"><button data-back aria-label="뒤로">‹</button><b>${E(t)}</b>${ri ? `<span class="ri">${ri}</span>` : ''}</header>`;
const tabs = (l, a) => `<div class="tabs">${l.map((t, i) => `<span class="${i === a ? 'on' : ''}">${t}</span>`).join('')}</div>`;
const unreadAll = () => D.chats.reduce((n, c) => n + c.unread, 0);
const KT = [['친구', '<circle cx="12" cy="8" r="3.6"/><path d="M5 20c0-4 3-6 7-6s7 2 7 6z"/>'], ['채팅', '<path d="M4 6a3 3 0 0 1 3-3h10a3 3 0 0 1 3 3v8a3 3 0 0 1-3 3h-6l-5 4v-4a3 3 0 0 1-2-3z"/>'], ['지금', '<circle cx="12" cy="12" r="9"/><path d="M10 8.5l5 3.500-5 3.500z"/>'], ['쇼핑', '<path d="M5 8h14l-1 12H6zM9 8a3 3 0 0 1 6 0"/>'], ['더보기', '<circle cx="6" cy="12" r="1.3"/><circle cx="12" cy="12" r="1.3"/><circle cx="18" cy="12" r="1.3"/>']];
const ktabs = () => `<div class="kt">${KT.map(([n, p], i) => `<span class="${i === 1 ? 'on' : ''}"><svg viewBox="0 0 24 24">${p}</svg>${n}${i === 1 && unreadAll() ? `<em>${unreadAll()}</em>` : ''}</span>`).join('')}</div>`;

const V = {
  kakao: () => `<header class="kh"><b>채팅</b><span>${SEARCH}${NEWCHAT}${GEAR}</span></header><div class="chips">${D.folders.map((f, i) => {
      const unread = unreadAll();
      return `<span class="${i ? '' : 'on'}${f === '안 읽음' && unread ? ' unread-chip' : ''}">${E(f)}${f === '안 읽음' && unread ? `<em>${unread}</em>` : ''}</span>`;
    }).join('')}</div><div class="sc">${D.chats.map((c, i) => `<div class="ct" data-go="room:${i}"><i class="av">${E(c.name[0])}</i><div><b>${E(c.name)}</b><small>${E(c.msgs.at(-1)[1])}</small></div><div class="rt">${c.time}${c.unread ? `<br><em>${c.unread}</em>` : ''}</div></div>`).join('')}</div>` + ktabs(),
  room(i) {
    const c = D.chats[i]; let prev = ''; c.unread = 0;
    return ab(c.name, 0, SEARCH + MENU) + `<div class="sc rm">${c.day ? `<p class="dy">${E(c.day)}</p>` : ''}${c.msgs.map(([w, t, tm, r]) => {
      if (w === 'me') { prev = w; return `<div class="m me"><div class="bl"><div class="mt">${r ? `<s>${r}</s>` : ''}<time>${tm}</time></div><span class="bb">${E(t)}</span></div></div>`; }
      const first = w !== prev; prev = w;
      return `<div class="m">${first ? `<i class="av">${E(w[0])}</i>` : '<i class="sp"></i>'}<div>${first ? `<b>${E(w)}</b>` : ''}<div class="bl"><span class="bb">${E(t)}</span><time>${tm}</time></div></div></div>`;
    }).join('')}</div><div class="inb">${L('<path d="M12 5v14M5 12h14"/>')}<div>${L('<circle cx="12" cy="12" r="8"/><path d="M8.5 14a4 4 0 0 0 7 0M9 10h.01M15 10h.01"/>')}</div><span class="h">#</span></div>`;
  },
  gallery: () => ab('갤러리', 1) + `<div class="sc"><p class="dh">${D.month}월</p>${D.photos.length ? `<div class="pg">${D.photos.map((p, i) => `<button data-go="photo:${i}" style="background:${bgOf(p)}" aria-label="${E(p.cap)}"></button>`).join('')}</div>` : '<p class="empty">사진이 없어요</p>'}</div>` + tabs(['사진', '앨범', '스토리'], 0),
  photo(i) { const p = D.photos[i]; return `<div class="ph" style="background:${bgOf(p)}"><div>${E(p.cap)}<small>${E(p.date)}</small></div></div>`; },
  phone: () => ab('최근 기록', 1) + `<div class="sc"><div class="card">${D.calls.map((c, i) => `<div class="cl ${c.type === 'miss' ? 'ms' : ''}" data-go="call:${i}"><span class="arr">${CALL[c.type][0]}</span><div><b>${E(c.name)}</b><small>${CALL[c.type][1]} · ${c.time}</small></div><span class="i">ⓘ</span></div>`).join('')}</div></div>` + tabs(['키패드', '최근 기록', '연락처'], 1),
  call(i) { const c = D.calls[i]; return ab(c.name) + `<div class="sc tr">${c.lines.length ? c.lines.map(([w, t]) => `<p><b>${E(w)}</b>${E(t)}</p>`).join('') : '<p class="empty">기록된 통화 내용이 없어요</p>'}</div>`; },
  cal() {
    const f = new Date(D.year, D.month - 1, 1).getDay(), n = new Date(D.year, D.month, 0).getDate(), ed = D.events.map(e => e.day);
    let g = ['일', '월', '화', '수', '목', '금', '토'].map((d, i) => `<span class="${i === 0 ? 'su' : i === 6 ? 'sa' : ''}">${d}</span>`).join('') + '<span></span>'.repeat(f);
    for (let d = 1; d <= n; d++) { const w = (f + d - 1) % 7; g += `<span class="${d === D.today ? 'td' : w === 0 ? 'su' : w === 6 ? 'sa' : ''}">${d}${ed.includes(d) ? '<u></u>' : ''}</span>`; }
    return ab(D.month + '월', 1) + `<div class="sc"><div class="mg">${g}</div><div class="card">${D.events.map(e => `<div class="ev"><i>${e.day}일</i><div><b>${E(e.title)}</b><small>${E(e.time)}</small></div></div>`).join('')}</div></div>`;
  }
};

const homeHTML = () => { const ev = D.events[0]; return `<div class="home"><div class="hw"><b>${T(D.time)}</b><small>${D.date}</small></div>${ev ? `<div class="wg"><small>다음 일정</small><b>${E(ev.title)}</b><span>${D.month}월 ${ev.day}일 ${E(ev.time)}</span></div>` : ''}<div class="apps">${APPS.map(([id, l]) => `<button data-go="${id}">${icon(id)}${l}</button>`).join('')}</div><div class="pgd"><i></i><i></i><i></i></div></div>`; };
const lockHTML = () => `<div class="ld">${D.date}</div><div class="clk">${T(D.time)}</div><div class="nt">${D.notifs.map(n => `<div class="nc">${icon(n.app)}<div><small>${E(n.name)} · ${E(n.time)}</small><b>${E(n.title)}</b>${E(n.body)}</div></div>`).join('')}</div><div class="sh"><span data-sh="전화"><svg viewBox="0 0 24 24"><path d="M6 4h3l1.5 4-2 1.5a11 11 0 0 0 5 5l1.500-2 4 1.500v3a2 2 0 0 1-2 2A13 13 0 0 1 4 6a2 2 0 0 1 2-2z"/></svg></span><div class="hnt"><svg viewBox="0 0 24 24"><path d="M6 14l6-6 6 6"/></svg>${E(D.lockHint)}</div><span data-sh="카메라"><svg viewBox="0 0 24 24"><rect x="3" y="7" width="18" height="12" rx="3"/><circle cx="12" cy="13" r="3.5"/></svg></span></div>`;

const anim = (el, c) => { el.className = ''; if (c) { void el.offsetWidth; el.className = c; } };
function render(dir) {
  scr.dataset.st = st; scr.dataset.v = st === 'app' ? stack.at(-1)[0] : '';
  view.innerHTML = st === 'home' || st === 'lock' ? homeHTML() : st === 'app' ? V[stack.at(-1)[0]](+stack.at(-1)[1]) : '';
  const hm = view.firstElementChild;
  if (st === 'lock' && hm) { hm.style.transform = 'scale(.93)'; hm.style.opacity = '.5'; }
  lk.hidden = st !== 'lock'; lk.style.cssText = ''; lk.className = ''; lk.innerHTML = st === 'lock' ? lockHTML() : '';
  if (dir === 'wake') { void lk.offsetWidth; lk.className = 'wake'; } else anim(wrap, dir);
  const rm = view.querySelector('.rm'); if (rm) rm.scrollTop = rm.scrollHeight;
  $('#off').hidden = st === 'off';
  $('#note').textContent = st === 'off' ? D.hint : D.hintOn;
}
const toast = m => { const t = $('#toast'); t.textContent = m; t.hidden = false; clearTimeout(tt); tt = setTimeout(() => t.hidden = true, 1300); };
const goHome = () => { if (st === 'home') return; st = 'home'; stack = []; render('homein'); };
const back = () => { if (st !== 'app') return; stack.pop(); if (stack.length) render('pop'); else { st = 'home'; render('homein'); } };

/* 잠금화면: 손가락(마우스)을 따라 올라가고, 놓을 때 충분히 올렸으면 열려요 */
const hmEl = () => view.firstElementChild;
lk.addEventListener('pointerdown', e => {
  if (st !== 'lock' || busy) return;
  dr = { y: e.clientY, t: e.timeStamp, dy: 0, sh: e.target.closest('[data-sh]')?.dataset.sh };
  lk.setPointerCapture(e.pointerId); lk.style.transition = 'none'; hmEl().style.transition = 'none';
});
lk.addEventListener('pointermove', e => {
  if (!dr) return;
  dr.dy = Math.min(0, e.clientY - dr.y);
  const p = Math.min(1, -dr.dy / lk.offsetHeight);
  lk.style.transform = `translateY(${dr.dy}px)`; hmEl().style.transform = `scale(${.93 + .07 * p})`; hmEl().style.opacity = .5 + .5 * p;
});
const release = e => {
  if (!dr) return;
  const d = dr, p = -d.dy / lk.offsetHeight, v = -d.dy / Math.max(1, e.timeStamp - d.t); dr = null;
  lk.style.transition = 'transform .34s cubic-bezier(.3,.7,.2,1)'; hmEl().style.transition = '';
  if (p > .25 || (v > .5 && -d.dy > 30)) {
    busy = true; lk.style.transform = 'translateY(-100%)'; hmEl().style.transform = ''; hmEl().style.opacity = '';
    setTimeout(() => { busy = false; st = 'home'; render(); }, 340);
  } else {
    lk.style.transform = ''; hmEl().style.transform = 'scale(.93)'; hmEl().style.opacity = '.5';
    if (-d.dy < 6) { if (d.sh) toast(d.sh + '은(는) 잠금 해제 후 사용할 수 있어요'); else { lk.classList.remove('nudge'); void lk.offsetWidth; lk.classList.add('nudge'); } }
  }
};
lk.addEventListener('pointerup', release); lk.addEventListener('pointercancel', release);

scr.addEventListener('click', e => {
  if (st === 'off') { st = 'lock'; return render('wake'); }
  if (st === 'lock') return;
  const g = e.target.closest('[data-go]');
  if (g) {
    const [n, i] = g.dataset.go.split(':');
    if (st === 'home') { const r = g.getBoundingClientRect(), w = wrap.getBoundingClientRect(); wrap.style.transformOrigin = `${r.left + r.width / 2 - w.left}px ${r.top + r.height / 2 - w.top}px`; }
    const dir = st === 'home' ? 'launch' : 'push';
    stack.push([n, i]); st = 'app'; return render(dir);
  }
  if (e.target.closest('[data-back]')) return back();
  const n = e.target.closest('[data-n]')?.dataset.n;
  if (n === 'h') goHome(); else if (n === 'b') back(); else if (n === 'r') toast('최근 사용한 앱이 없어요');
});
$('#off').onclick = () => { st = 'off'; stack = []; render(); };
render();
</script>
</body>
</html>
