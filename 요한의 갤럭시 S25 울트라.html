/* Responsive Galaxy S25 Ultra frame and UI refinement */
:root {
  --phone-width: min(92vw, 440px, calc((100dvh - 54px) * 9 / 19.5));
  --phone-height: min(calc(92vw * 19.5 / 9), 953px, calc(100dvh - 54px));
}
html, body { width:100%; min-height:100%; }
body {
  min-height:100dvh;
  padding:18px 0;
  overflow:auto;
  background:radial-gradient(ellipse at 50% 35%, #eef0f3 0%, #d4d8de 68%, #c7cbd2 100%);
}
.stage { width:100%; min-height:calc(100dvh - 36px); justify-content:center; gap:12px; }
.phone {
  width:var(--phone-width);
  height:var(--phone-height);
  min-height:0;
  aspect-ratio:auto;
  flex:none;
  padding:clamp(6px, 1.7%, 9px);
  border-radius:clamp(28px, 7vw, 42px);
  font-size:calc(var(--phone-width) / 25.5);
  box-shadow:0 0 0 1px #7d8188, 0 0 0 3px #303238, 0 18px 42px #0003;
}
.screen { width:100%; height:100%; min-height:0; border-radius:clamp(22px, 5.8vw, 34px); }
.sb {
  height:2.45em;
  padding: max(.55em, env(safe-area-inset-top)) 1.05em 0;
  gap:1em;
  font-size:.78em;
  font-weight:600;
}
.sb .r { gap:.42em; }
.sb .status-ico { width:1.15em; height:1.05em; }
.sb .signal-ico { width:1.12em; height:1.12em; }
.sb .battery-pill { min-width:2.55em; height:1.48em; padding:0 .36em; font-size:.94em; }
.cam { top:.72em; width:.82em; height:.82em; margin-left:-.41em; }
#view { overflow:hidden; }
.kakao-page { width:100%; height:100%; min-height:0; overflow:hidden; }
.kakao-page .sc { overscroll-behavior:contain; }
.kh { padding:2.8em 1.15em .7em; }
.kh b { font-size:1.48em; }
.kh span { gap:.85em; }
.kh button { width:2em; height:2em; }
.kh button svg { width:1.35em; height:1.35em; }
.chips { padding:.25em 1em .75em; }
.ct { gap:.75em; }
.kt { padding:.48em 0 .3em; }
.room-page .kh { padding-top:2.8em; }
.room-page .inb { padding-bottom:.55em; }
.room-page .rm { flex:1; min-height:0; }
.room-page .inb input { font-size:1em; }
.dialer {
  padding:.35em 1.25em .25em;
  gap:0;
  overflow:hidden;
}
.dial-number {
  flex:0 0 3.05em;
  min-height:0;
  font-size:1.75em;
  font-weight:400;
  letter-spacing:.015em;
  color:#17191d;
}
.dial-sub { flex:0 0 1.2em; height:auto; }
.dial-grid {
  width:min(100%, 16.8em);
  max-width:16.8em;
  flex:1 1 auto;
  min-height:0;
  margin:.25em auto .35em;
  grid-template-columns:repeat(3, minmax(0, 1fr));
  grid-template-rows:repeat(4, minmax(0, 1fr));
  gap:.34em 1.05em;
  align-content:stretch;
}
.dial-key {
  width:min(100%, 4.25em);
  height:auto;
  aspect-ratio:1 / 1;
  justify-self:center;
  align-self:center;
  min-width:0;
  min-height:0;
  max-height:100%;
  border-radius:50%;
  background:#f4f5f7;
  color:#191b1f;
  font-size:1.22em;
  font-weight:400;
  line-height:1;
  box-shadow:inset 0 0 0 1px #eff0f2;
}
.dial-key:active { background:#e6e8ec; transform:scale(.96); }
.dial-key small { margin-top:.3em; font-size:.38em; font-weight:600; color:#626a74; letter-spacing:.12em; }
.dial-actions {
  flex:0 0 4.2em;
  min-height:4.2em;
  padding:0 0 .15em;
  gap:2.1em;
}
.dial-call { width:3.25em; height:3.25em; background:#1fc66d; box-shadow:0 2px 5px #1fc66d33; }
.dial-call:active { transform:scale(.94); }
.dial-delete { display:grid; place-items:center; width:3em; height:3em; padding:0; border-radius:50%; font-size:1.15em; }
.phone-tabs {
  padding:.48em .4em calc(.25em + env(safe-area-inset-bottom));
  min-height:3.6em;
  font-size:.65em;
}
.phone-tabs svg { width:1.65em; height:1.65em; }
.nav { height:2.15em; flex:none; }
.nav button { width:4em; }
@media (min-width:700px) {
  :root {
    --phone-width:min(38vw, 440px, calc((100dvh - 60px) * 9 / 19.5));
    --phone-height:min(calc(38vw * 19.5 / 9), 953px, calc(100dvh - 60px));
  }
}
@media (max-height:720px) {
  :root {
    --phone-width:min(76vw, calc((100dvh - 28px) * 9 / 19.5), 360px);
    --phone-height:min(calc(76vw * 19.5 / 9), calc(100dvh - 28px), 780px);
  }
  body { padding:8px 0; }
  .stage { min-height:calc(100dvh - 16px); }
  .dial-number { flex-basis:2.4em; }
  .dial-actions { flex-basis:3.5em; min-height:3.5em; }
  .dial-call { width:2.8em; height:2.8em; }
}
@media (max-width:380px) {
  :root { --phone-width:94vw; --phone-height:calc(94vw * 19.5 / 9); }
  .phone { font-size:calc(var(--phone-width) / 25.5); }
  .dial-grid { gap:.2em .55em; }

<style id="responsive-fit">
/* 화면 크기에 맞춰 자동 최적화: PC는 창 높이에 맞춰 크게, 모바일은 화면에 꽉 차게 */
:root{--phone-width:max(300px,min(460px,96vw,calc((100dvh - 96px)*77.6/162.8)))}
html{-webkit-text-size-adjust:100%;overscroll-behavior:none}
body{padding:16px 0 20px!important}
.phone{padding:calc(var(--phone-width)*.028)!important;border-radius:calc(var(--phone-width)*.11)!important;touch-action:manipulation}
.screen{border-radius:calc(var(--phone-width)*.086)!important}
.side{right:calc(var(--phone-width)*-.017)!important;width:calc(var(--phone-width)*.019)!important}
.stage{gap:8px!important}
.note{font-size:12px;line-height:1.4;padding:0 8px}
/* 모바일(세로): 꽉 차게 */
@media (max-width:600px){
  :root{--phone-width:max(300px,min(98vw,calc((100dvh - 56px)*77.6/162.8)))}
  body{padding:6px 0 8px!important}
  .label{display:none}
  .stage{gap:4px!important}
  .note{font-size:11px}
  .phone{padding:calc(var(--phone-width)*.02)!important}
  .side{right:-3px!important;width:4px!important}
}
/* 낮은 화면(가로 모드 등): 너무 작아지지 않게 하고 세로로 스크롤 */
@media (max-height:520px){
  :root{--phone-width:min(340px,96vw)}
  .label{display:none}
}
</style>

});

  ['timer', '타이머', '<path d="M7 3h10M7 21h10M8 3v3l4 4 4-4V3M8 21v-3l4-4 4 4v3"/>']
];
const swNow = () => CK.sw.acc + (CK.sw.run ? performance.now() - CK.sw.start : 0);
const swFmt = ms => `${p2(Math.floor(ms / 60000))}:${p2(Math.floor(ms / 1000) % 60)}.${p2(Math.floor(ms / 10) % 100)}`;
const lapsHTML = () => { const w = CK.sw, rows = []; if (swNow() || w.laps.length) rows.push(`<div class="lp"><span>랩 ${w.laps.length + 1}</span><span>${swFmt(swNow() - w.lapStart)}</span></div>`); w.laps.slice().reverse().forEach((l, i) => rows.push(`<div class="lp"><span>랩 ${w.laps.length - i}</span><span>${swFmt(l)}</span></div>`)); return rows.join(''); };
const tmSecs = () => { const d = tm.digits.padStart(6, '0'); return +d.slice(0, 2) * 3600 + +d.slice(2, 4) * 60 + +d.slice(4); };
const tmLeft = () => tm.running ? (tm.paused ? tm.left : Math.max(0, tm.end - Date.now())) : 0;
const tmFmt = ms => { const t = Math.ceil(ms / 1000), H = Math.floor(t / 3600); return (H ? H + ':' : '') + p2(Math.floor(t / 60) % 60) + ':' + p2(t % 60); };
const tmDisp = () => { const d = tm.digits.padStart(6, '0'); return `${d.slice(0, 2)}<small>시간</small>${d.slice(2, 4)}<small>분</small>${d.slice(4)}<small>초</small>`; };

V.clock = () => {
  const C = D.clock || {}, tab = CK.tab || C.startTab || 'alarm';
  const bar = t => `<header class="ab big ck"><b>${t}</b><span class="ri">${L('<path d="M12 5v14M5 12h14"/>')}${L('<circle cx="12" cy="5" r=".9"/><circle cx="12" cy="12" r=".9"/><circle cx="12" cy="19" r=".9"/>')}</span></header>`;
  let body = '';
  if (tab === 'alarm') body = bar('알람') + `<div class="sc">${(C.alarms || []).map((a, i) => { const [ap, t] = apm(a.time); return `<div class="al ${a.on ? '' : 'off'}" data-alarm="${i}"><div><small>${E(a.label)}${a.repeat ? ' · ' + E(a.repeat) : ''}</small><div class="at"><span>${ap}</span>${t}</div></div><button class="swc ${a.on ? 'on' : ''}" aria-label="알람 켜기/끄기"><i></i></button></div>`; }).join('')}</div>`;
  else if (tab === 'world') body = bar('세계 시계') + `<div class="sc">${(C.world || []).map(w => {
    const [hh, mm] = cur().split(':').map(Number), diff = w.offset - (C.home ?? 9); let t = hh * 60 + mm + diff * 60, day = '오늘';
    if (t < 0) { t += 1440; day = '어제'; } else if (t >= 1440) { t -= 1440; day = '내일'; }
    const [ap, tx] = apm(p2(Math.floor(t / 60)) + ':' + p2(t % 60));
    return `<div class="wl"><div><b>${E(w.city)}</b><small>${day}, ${diff >= 0 ? '+' : ''}${diff}시간</small></div><div class="at"><span>${ap}</span>${tx}</div></div>`;
  }).join('')}</div>`;
  else if (tab === 'sw') body = bar('스톱워치') + `<div class="swt" id="swt">${swFmt(swNow())}</div><div class="swb"><button class="pill gray" data-swl>${CK.sw.run ? '랩' : (swNow() ? '재설정' : '랩')}</button><button class="pill ${CK.sw.run ? 'red' : 'blue'}" data-sws>${CK.sw.run ? '중단' : '시작'}</button></div><div class="sc laps" id="laps">${lapsHTML()}</div>`;
  else body = bar('타이머') + (tm.running
    ? `<div class="sc"><div class="ring"><svg viewBox="0 0 100 100"><circle class="rb" cx="50" cy="50" r="46"/><circle class="rf" id="rf" cx="50" cy="50" r="46" style="stroke-dashoffset:${289 * (1 - tmLeft() / tm.total)}"/></svg><div class="ckr" id="tmt">${tmFmt(tmLeft())}</div></div><div class="swb"><button class="pill gray" data-tmc>취소</button><button class="pill ${tm.paused ? 'blue' : 'orange'}" data-tmp>${tm.paused ? '재개' : '일시 정지'}</button></div></div>`
    : `<div class="sc"><div class="tmd">${tmDisp()}</div><div class="tpre">${(C.presets || [60, 180, 300, 600]).map(x => `<button data-tpre="${x}">${x >= 60 ? x / 60 + '분' : x + '초'}</button>`).join('')}</div><div class="tkp">${['1', '2', '3', '4', '5', '6', '7', '8', '9', '00', '0', 'd'].map(k => `<button data-tk="${k}">${k === 'd' ? L('<path d="M9 6h11a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H9l-6-6z"/><path d="M13 10l4 4M17 10l-4 4"/>') : k}</button>`).join('')}</div><div class="swb"><button class="pill blue" data-tms ${tmSecs() ? '' : 'disabled'}>시작</button></div></div>`);
  return body + `<div class="phone-tabs">${CKT.map(([id, l, pth]) => `<button class="${id === tab ? 'on' : ''}" data-clock-tab="${id}"><svg viewBox="0 0 24 24">${pth}</svg>${l}</button>`).join('')}</div>`;
};
const swLoop = () => { const t = $('#swt'); if (!t || !CK.sw.run) return; t.textContent = swFmt(swNow()); const l = $('#laps'); if (l) l.innerHTML = lapsHTML(); requestAnimationFrame(swLoop); };
const tmLoop = () => { const t = $('#tmt'); if (!t || !tm.running) return; const left = tmLeft(), r = $('#rf'); t.textContent = tmFmt(left); if (r) r.style.strokeDashoffset = 289 * (1 - left / tm.total); if (!(left <= 0 && !tm.paused)) requestAnimationFrame(tmLoop); };
function clockMount() {
  view.style.background = '#f6f6f6';
  if (CK.tab === 'sw' && CK.sw.run) requestAnimationFrame(swLoop);
  if (CK.tab === 'timer' && tm.running) requestAnimationFrame(tmLoop);
}
const bell = () => {   // 타이머 알림음
  try {
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    if (ac.state === 'suspended') ac.resume();
    const t = ac.currentTime;
    [0, .32, .64, 1.1, 1.42, 1.74].forEach((o, i) => {
      const x = ac.createOscillator(), g = ac.createGain();
      x.frequency.value = i % 3 === 2 ? 988 : 784; g.gain.setValueAtTime(0, t + o); g.gain.linearRampToValueAtTime(.08, t + o + .02); g.gain.exponentialRampToValueAtTime(.0001, t + o + .28);
      x.connect(g).connect(ac.destination); x.start(t + o); x.stop(t + o + .3);
    });
  } catch (e) {}
};
const banner = (app, title, text, iconId = 'clock') => {   // 화면 위에서 내려오는 알림(팝업)
  const el = document.createElement('div'); el.className = 'hub';
  el.innerHTML = `<div class="hh"><i class="ic" style="background:${BG[iconId]}">${G[iconId]}</i><span>${E(app)}</span><em>·</em><span>지금</span><svg class="chev" viewBox="0 0 24 24"><path d="M7 10l5 5 5-5"/></svg></div><b>${E(title)}</b><p>${E(text)}</p>`;
  scr.append(el); requestAnimationFrame(() => requestAnimationFrame(() => el.classList.add('in')));
  let y0 = null, dy = 0, timer;
  const kill = () => { clearTimeout(timer); el.style.transform = ''; el.style.transition = ''; el.classList.remove('in'); setTimeout(() => el.remove(), 350); };
  el.addEventListener('pointerdown', e => { y0 = e.clientY; dy = 0; el.setPointerCapture(e.pointerId); el.style.transition = 'none'; clearTimeout(timer); });
  el.addEventListener('pointermove', e => { if (y0 == null) return; dy = Math.min(0, e.clientY - y0); el.style.transform = `translateY(${dy}px)`; });
  const up = () => { if (y0 == null) return; y0 = null; el.style.transition = ''; if (dy < -24) return kill(); el.style.transform = ''; if (dy > -6) kill(); else timer = setTimeout(kill, 2500); };
  el.addEventListener('pointerup', up); el.addEventListener('pointercancel', up);
  timer = setTimeout(kill, 4500);
};
function tmArm(ms) {   // 타이머가 끝나면: 알림 + 알림음 → (링크가 있으면) 잠시 뒤 이동
  clearTimeout(tmDone); tmDone = null;
  if (ms == null) return;
  tmDone = setTimeout(() => {
    tm.running = false; bell(); setTimeout(bell, 2200);
    banner('시계', '타이머', '타이머가 종료되었어요');
    if (st === 'app' && stack.at(-1)[0] === 'clock') render();
    const link = ((D.clock || {}).timer || {}).link;
    if (link) setTimeout(() => { window.location.href = link; }, 1500);
  }, Math.max(0, ms));
}
function clockClick(e) {
  if (st !== 'app' || stack.at(-1)[0] !== 'clock') return false;
  const q = s => e.target.closest(s); let el;
  if ((el = q('[data-clock-tab]'))) { CK.tab = el.dataset.clockTab; render(); return true; }
  if ((el = q('[data-alarm] .swc'))) { const row = el.closest('[data-alarm]'), a = D.clock.alarms[+row.dataset.alarm]; a.on = !a.on; el.classList.toggle('on', a.on); row.classList.toggle('off', !a.on); return true; }
  if (q('[data-sws]')) { const w = CK.sw; if (w.run) { w.acc = swNow(); w.run = false; } else { w.start = performance.now(); w.run = true; } render(); return true; }
  if (q('[data-swl]')) { const w = CK.sw; if (w.run) { const n = swNow(); w.laps.push(n - w.lapStart); w.lapStart = n; $('#laps').innerHTML = lapsHTML(); } else { w.acc = 0; w.laps = []; w.lapStart = 0; render(); } return true; }
  if ((el = q('[data-tk]'))) { const k = el.dataset.tk; tm.digits = k === 'd' ? tm.digits.slice(0, -1) : (tm.digits + k).replace(/^0+/, '').slice(0, 6); render(); return true; }
  if ((el = q('[data-tpre]'))) { const x = +el.dataset.tpre; tm.digits = String(Math.floor(x / 3600) * 10000 + (Math.floor(x / 60) % 60) * 100 + x % 60); render(); return true; }
  if (q('[data-tms]')) { const tot = tmSecs() * 1000; if (!tot) return true; tm.total = tot; tm.end = Date.now() + tot; tm.running = true; tm.paused = false; tmArm(tot); render(); return true; }
  if (q('[data-tmp]')) { if (tm.paused) { tm.end = Date.now() + tm.left; tm.paused = false; tmArm(tm.left); } else { tm.left = tmLeft(); tm.paused = true; tmArm(null); } render(); return true; }
  if (q('[data-tmc]')) { tm.running = false; tm.paused = false; tmArm(null); render(); return true; }
  return false;
}

/* ── 오른쪽 옆 버튼: 화면 켜기/끄기 ── */
$('#pwr').onclick = () => {
  if (busy) return;
  if (st === 'off') { st = 'lock'; render('wake'); return; }
  closeCall(); if (incEl) incEl.querySelector('.rj').click(); busy = true; scr.classList.add('sleep');
  setTimeout(() => { busy = false; scr.classList.remove('sleep'); st = 'off'; stack = []; render(); }, 200);
};
try {   // 편집기에서 저장한 내용은 새로고침해도 항상 적용
  const saved = {};   // 보기 전용
  for (const t of ['chat', 'call']) for (const i in (saved[t] || {})) liveApply({ to: 'site', type: t, i: +i, text: saved[t][i] });
} catch (_) {}
render();
loadWeatherData();
</script>
